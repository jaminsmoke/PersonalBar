name: docs

on:
  push:
    branches:
      - main
    paths:
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    # Escrito solo en el job que publica (mkdocs gh-deploy escribe en Pages).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.5

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x

      - name: Set cache ID
        run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Validate documentation
        run: mkdocs build --strict --site-dir site

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
