name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lint --no-daemon

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

  assemble:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-bar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  family-contracts:
    name: Family contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Identity OpenAPI specs
        uses: actions/checkout@v4
        with:
          repository: jaminsmoke/PersonalHostel-Server
          ref: main
          path: .family/identity
          sparse-checkout: |
            docs/openapi-camareros.json
            docs/openapi-negocio.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test contract checker
        run: python scripts/check_family_contracts.py --selftest

      - name: Check Bar paths against Identity OpenAPI
        run: >
          python scripts/check_family_contracts.py
          --camareros-openapi .family/identity/docs/openapi-camareros.json
          --negocio-openapi .family/identity/docs/openapi-negocio.json

      - name: Self-test LAN contract checker
        run: python scripts/check_lan_contract.py --selftest

      - name: Check LAN contract coherence
        run: python scripts/check_lan_contract.py
